# ============================================================================
# dsh-shutup 的 bundle patch —— 把打断提示插件挂进 DSH 配置树
# ============================================================================
# 本插件是纯客户端实现：宿主条目仅为满足 bundle 装配形态的最小占位，
# 全部逻辑（全局快捷键、打断、steer 注入、设置录制）在 lib/client.js。
# ============================================================================

- insert:
    - id: shutup
      name: 'dsh-shutup'
      config: {}
